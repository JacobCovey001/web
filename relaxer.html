<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relaxer</title>
    <!-- Link to CSS file [1] -->
    <link rel="stylesheet" href="relaxer.css">
</head>
<body>
    <h1>Relaxer</h1>

    <!-- Main container for the breathing animation [1, 2] -->
    <div class="container" id="container">
        <!-- Inner circle [1, 3] -->
        <div class="circle"></div>

        <!-- Dynamic text for breathing instructions [1, 4] -->
        <p id="text">Breathe In!</p>

        <!-- Moving pointer to track the breathing cycle [1, 5, 6] -->
        <div class="pointer-container">
            <span class="pointer"></span>
        </div>

        <!-- Background gradient circle for visual timing [1, 7] -->
        <div class="gradient-circle"></div>
    </div>

    <!-- Link to JavaScript file [1] -->
    <script src="relaxer.js"></script>
</body>
</html>
